<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>GaliOrienta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-700: #0069b4;
    --primary-800: #0a4b77;
    --primary-900: #13283e;
    --secondary:   #ffe55d;
    --neutral-100: #e2e7e9;
    --neutral-500: #889598;
    --neutral-700: #344549;
    --alert-700:   #b91c1c;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: Inter, Helvetica, Arial, sans-serif, system-ui;
    color: var(--neutral-700);
    background: #fff;
  }

  /* --- vista del prototipo --- */
  #view {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0; margin: 0; padding: 0;
    display: block; background: #fff;
  }
  #view[hidden] { display: none; }

  /* --- pantalla de acceso --- */
  #gate {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, var(--primary-900) 0%, var(--primary-800) 100%);
  }
  .card {
    width: 100%; max-width: 400px;
    background: #fff; border-radius: 12px;
    padding: 40px 36px 32px;
    box-shadow: 0 18px 50px rgba(4, 21, 27, .35);
  }
  .brand {
    font-family: Lexend, Inter, sans-serif;
    font-size: 2rem; font-weight: 700; line-height: 1.1;
    color: var(--primary-900); margin: 0;
  }
  .brand span { color: var(--primary-700); }
  .tagline {
    margin: 8px 0 28px;
    font-size: .95rem; color: var(--neutral-500);
  }
  .rule { height: 4px; width: 48px; background: var(--secondary); border-radius: 2px; margin: 0 0 24px; }
  label {
    display: block; font-size: .85rem; font-weight: 600;
    color: var(--neutral-700); margin-bottom: 6px;
  }
  input[type=password] {
    width: 100%; padding: 11px 13px;
    font: inherit; font-size: 1rem;
    color: var(--neutral-700);
    border: 1px solid #bec7c9; border-radius: 7px;
    background: #fff; transition: border-color .15s, box-shadow .15s;
  }
  input[type=password]:focus {
    outline: none;
    border-color: var(--primary-700);
    box-shadow: 0 0 0 3px rgba(0, 105, 180, .16);
  }
  button {
    width: 100%; margin-top: 18px; padding: 12px 16px;
    font: inherit; font-size: 1rem; font-weight: 600; color: #fff;
    background: var(--primary-700); border: 0; border-radius: 7px;
    cursor: pointer; transition: background .15s;
  }
  button:hover:not(:disabled) { background: var(--primary-800); }
  button:disabled { background: var(--neutral-500); cursor: progress; }
  .msg {
    min-height: 20px; margin-top: 14px;
    font-size: .875rem; color: var(--alert-700); text-align: center;
  }
  .foot {
    margin: 26px 0 0; padding-top: 18px;
    border-top: 1px solid var(--neutral-100);
    font-size: .78rem; color: var(--neutral-500); text-align: center; line-height: 1.5;
  }
  .noscript { color: var(--alert-700); font-size: .9rem; text-align: center; }
</style>
</head>
<body>

<iframe id="view" title="Prototipo GaliOrienta" hidden></iframe>

<div id="gate">
  <div class="card">
    <h1 class="brand">Gali<span>Orienta</span></h1>
    <p class="tagline">Plataforma de orientación educativa de EdugalIA</p>
    <div class="rule"></div>

    <form id="form" autocomplete="off">
      <label for="pass">Contrase&ntilde;a de acceso</label>
      <input id="pass" type="password" autocomplete="current-password" autofocus required />
      <button id="btn" type="submit">Entrar</button>
      <p class="msg" id="msg" role="alert" aria-live="polite"></p>
    </form>

    <noscript><p class="noscript">Este prototipo necesita JavaScript activado.</p></noscript>
    <p class="foot">Contenido cifrado en el navegador (AES-256-GCM).<br />Documento de trabajo, no distribuir.</p>
  </div>
</div>

  var ITERATIONS = 600000;
  var ENTRY      = "index.html";

  var SALT_BYTES = 16, IV_BYTES = 12;
  var SS_KEY = 'GaliOrienta.k';

  var gate = document.getElementById('gate');
  var view = document.getElementById('view');
  var form = document.getElementById('form');
  
  const params = new URLSearchParams(window.location.search);
  const passparam = params.get('passparam');
  
  var pass = document.getElementById('pass');
  pass.value = passparam
  
  var btn  = document.getElementById('btn');
  var msg  = document.getElementById('msg');

  var PAGES = null;

  // ------------------------------------------------------------- utilidades

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function bytesToB64(buf) {
    var b = new Uint8Array(buf), s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  }

  // crypto.subtle solo existe en contexto seguro (https o localhost).
  if (!window.crypto || !window.crypto.subtle) {
    btn.disabled = true;
    msg.textContent = 'Requiere HTTPS (o localhost) para descifrar.';
    return;
  }

  var RAW  = b64ToBytes(PAYLOAD);
  var SALT = RAW.slice(0, SALT_BYTES);
  var IV   = RAW.slice(SALT_BYTES, SALT_BYTES + IV_BYTES);
  var DATA = RAW.slice(SALT_BYTES + IV_BYTES);   // ciphertext || authTag

  // -------------------------------------------------------------- descifrado

  function keyFromPassword(pw) {
    return crypto.subtle
      .importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: SALT, iterations: ITERATIONS, hash: 'SHA-256' },
          km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
        );
      });
  }

  // Contrasena incorrecta -> AES-GCM falla la verificacion de integridad
  // y decrypt lanza OperationError. No hace falta guardar ningun hash.
  function decryptWith(key) {
    return crypto.subtle
      .decrypt({ name: 'AES-GCM', iv: IV, tagLength: 128 }, key, DATA)
      .then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
  }

  function unlock(key, remember) {
    return decryptWith(key).then(function (pages) {
      PAGES = pages;
      if (remember) {
        // Se guarda la CLAVE DERIVADA (32 bytes), nunca el contenido descifrado.
        // sessionStorage es por pestana y se borra al cerrarla.
        crypto.subtle.exportKey('raw', key).then(function (raw) {
          try { sessionStorage.setItem(SS_KEY, bytesToB64(raw)); } catch (e) {}
        });
      }
      gate.parentNode.removeChild(gate);
      view.hidden = false;
      show(currentPage());
    });
  }

  // ------------------------------------------------------------------ router

  function currentPage() {
    var h;
    try { h = decodeURIComponent(location.hash.replace(/^#/, '')); }
    catch (e) { h = ''; }
    return (PAGES && PAGES[h]) ? h : ENTRY;
  }

  function show(page) {
    view.srcdoc = PAGES[page];
  }

  // Dentro de 'load' el contentDocument ya existe: resuelve el timing
  // sin sondeos. srcdoc es same-origin, asi que es accesible.
  view.addEventListener('load', function () {
    if (!PAGES) return;
    var doc = view.contentDocument;
    if (!doc) return;

    document.title = doc.title || 'GaliOrienta';

    doc.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      var href = a.getAttribute('href');
      if (!href) return;
      if (href.charAt(0) === '#') return;              // anclas decorativas del mock
      if (/^[a-z][a-z0-9+.-]*:/i.test(href)) return;   // http:, mailto:, tel:...
      if (!PAGES[href]) return;                        // recurso desconocido
      e.preventDefault();
      if (currentPage() === href) show(href);          // misma pagina: no hay hashchange
      else location.hash = '#' + href;
    }, true);
  });

  window.addEventListener('hashchange', function () {
    if (PAGES) show(currentPage());
  });

  // -------------------------------------------------------------------- login

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Descifrando…';

    // Dos frames para que el boton se repinte antes de que PBKDF2 bloquee el hilo.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        keyFromPassword(pass.value)
          .then(function (key) { return unlock(key, true); })
          .catch(function () {
            msg.textContent = 'Contraseña incorrecta.';
            btn.disabled = false;
            btn.textContent = 'Entrar';
            pass.select();
          });
      });
    });
  });

  // Reapertura tras F5: reutiliza la clave de la pestana y evita repetir PBKDF2.
  (function bootstrap() {
    var stored = null;
    try { stored = sessionStorage.getItem(SS_KEY); } catch (e) {}
    if (!stored) { pass.focus(); return; }

    crypto.subtle
      .importKey('raw', b64ToBytes(stored), { name: 'AES-GCM' }, true, ['decrypt'])
      .then(function (key) { return unlock(key, false); })
      .catch(function () {
        try { sessionStorage.removeItem(SS_KEY); } catch (e) {}
        pass.focus();
      });
  })();
})();
</script>
